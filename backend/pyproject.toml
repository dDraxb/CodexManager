[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-session-manager-backend"
version = "0.1.0"
description = "Local-first Codex session manager backend"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1.0",
  "fastapi>=0.116,<1.0",
  "uvicorn>=0.35,<1.0",
]

[project.scripts]
codexmgr = "app.cli.main:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
